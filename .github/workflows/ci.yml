name: CAD loop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: bash scripts/check_environment.sh
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest --junitxml=artifacts/junit.xml
      - run: uv run --locked python scripts/mcp_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-evidence-macos-arm64
          path: artifacts/
